[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomriya-identity"
version = "0.1.0"
description = "ZOOMRIYA ID's shared formats: tokens, keys, events, levels, quiet hours, the family's place"
license = "MPL-2.0"
requires-python = ">=3.13"
# Lower bounds only: whoever installs it pins exact versions in its own requirements.txt.
dependencies = [
    "PyJWT[crypto]>=2.15",
]

[tool.setuptools.packages.find]
include = ["zoomriya_identity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
