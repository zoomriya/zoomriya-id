# What a backup of ZOOMRIYA ID holds (zoomriya-apps' platform/backup/backup.sh reads this;
# deploy/install.sh puts it in /etc/zoomriya/backup.d/). Backed up first:
# without the accounts and the signing key, no restored app can be opened.
APP=id
DATABASE=zoomriya_id
DATABASE_OWNER=zoomriya_id
# The signing key and the profile photos.
PATHS=(/data/zoomriya-id)
OPTIONAL_PATHS=()
OWNER=zoomriya-id
STOP=(zoomriya-id)
START=(zoomriya-id)
