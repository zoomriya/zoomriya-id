[alembic]
script_location = migrations
prepend_sys_path = .
# How the path lists here are split (os = the platform's separator).
path_separator = os
sqlalchemy.url = postgresql+psycopg://zoomriya:root@localhost:5432/zoomriya_id

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
